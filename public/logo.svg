<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background shape -->
  <rect x="10" y="15" width="80" height="70" rx="12" fill="url(#mGrad)" opacity="0.15" />
  
  <!-- Film strip holes top -->
  <rect x="20" y="22" width="6" height="10" rx="2" fill="#a78bfa" opacity="0.6" />
  <rect x="36" y="22" width="6" height="10" rx="2" fill="#a78bfa" opacity="0.6" />
  <rect x="52" y="22" width="6" height="10" rx="2" fill="#a78bfa" opacity="0.6" />
  <rect x="68" y="22" width="6" height="10" rx="2" fill="#a78bfa" opacity="0.6" />
  
  <!-- Film strip holes bottom -->
  <rect x="20" y="68" width="6" height="10" rx="2" fill="#a78bfa" opacity="0.6" />
  <rect x="36" y="68" width="6" height="10" rx="2" fill="#a78bfa" opacity="0.6" />
  <rect x="52" y="68" width="6" height="10" rx="2" fill="#a78bfa" opacity="0.6" />
  <rect x="68" y="68" width="6" height="10" rx="2" fill="#a78bfa" opacity="0.6" />

  <!-- Main M letter -->
  <text x="50" y="60" text-anchor="middle" font-family="'Space Mono', monospace" font-weight="700" font-size="42" fill="url(#mGrad)" filter="url(#glow)">M</text>
  
  <!-- 09 subscript -->
  <text x="50" y="76" text-anchor="middle" font-family="'Space Mono', monospace" font-weight="400" font-size="14" fill="#a78bfa" opacity="0.8">09</text>

  <!-- Accent corner -->
  <path d="M10 35 L10 25 L20 25" stroke="#a78bfa" stroke-width="1.5" fill="none" opacity="0.5" />
  <path d="M90 35 L90 25 L80 25" stroke="#a78bfa" stroke-width="1.5" fill="none" opacity="0.5" />
</svg>
